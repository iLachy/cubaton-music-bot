```yaml
name: Cubaton Music Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

# Permite a GitHub Actions guardar
# state/releases.json en el repositorio.
permissions:
  contents: write

# Evita que dos ejecuciones trabajen
# simultáneamente.
concurrency:
  group: cubaton-music-bot
  cancel-in-progress: false

jobs:

  ejecutar-bot:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Descargar repositorio
      # ------------------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Configurar Python
      # ------------------------------------------------------

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Instalar dependencias
      # ------------------------------------------------------

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------
      # Ejecutar bot
      # ------------------------------------------------------

      - name: Ejecutar Cubaton Music Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py

      # ------------------------------------------------------
      # Guardar estado
      # ------------------------------------------------------

      - name: Guardar estado de lanzamientos
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/releases.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el estado."

          else

            git commit -m "Actualizar estado de lanzamientos"

            git push

          fi
```
