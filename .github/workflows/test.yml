name: Paso 15 - Verificar canales de YouTube Music

on:
  workflow_dispatch:

jobs:
  verificar-canales:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar ytmusicapi
        run: |
          pip install --upgrade ytmusicapi

      - name: Verificar los 38 artistas
        run: |
          python bot.py
