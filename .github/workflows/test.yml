name: Paso 17 - Verificacion estricta de artistas

on:
  workflow_dispatch:

jobs:
  verificar-artistas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install --upgrade ytmusicapi requests

      - name: Ejecutar verificacion
        run: |
          python bot.py
