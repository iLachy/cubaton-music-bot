name: Cubaton Music Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cubaton-music-bot
  cancel-in-progress: false

jobs:

  ejecutar-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instalación de FFmpeg para procesar el audio MP3
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # Inyección segura de las cookies de YouTube desde los secretos de GitHub
      - name: Crear archivo de cookies
        shell: bash
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
            echo "cookies.txt creado correctamente."
          else
            echo "No se configuró YOUTUBE_COOKIES. Continuando sin cookies..."
          fi

      - name: Ejecutar Cubaton Music Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py

      - name: Guardar estado de lanzamientos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/releases.json
          if git diff --cached --quiet; then
            echo "No hay cambios en el estado."
          else
            git commit -m "Actualizar estado de lanzamientos"
            git push
          fi
