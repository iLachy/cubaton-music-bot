name: Paso 16 - Resolver canales directamente

on:
  workflow_dispatch:

jobs:
  resolver-canales:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install --upgrade ytmusicapi requests

      - name: Resolver canales
        run: |
          python bot.py
