name: Test - Publication State

on:
  workflow_dispatch:

jobs:
  test-publication-state:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python
        run: python --version

      - name: Check publication_state.py
        run: |
          if [ ! -f "publication_state.py" ]; then
            echo "ERROR: publication_state.py no existe en la raíz del repositorio."
            exit 1
          fi

          echo "OK: publication_state.py encontrado."

      - name: Run publication_state.py test
        run: python publication_state.py
