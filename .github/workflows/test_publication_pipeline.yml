name: Test - Publication Pipeline

on:
  workflow_dispatch:
    inputs:
      deezer_url:
        description: "URL de Deezer del single, EP o álbum"
        required: true
        type: string

      track_title:
        description: "Título de la pista a probar (vacío para single o primera pista)"
        required: false
        default: ""
        type: string

jobs:

  test-publication-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests ytmusicapi

      - name: Mostrar parámetros de prueba
        run: |
          echo "========================================"
          echo "PRUEBA DEL PIPELINE COMPLETO"
          echo "========================================"

          echo ""
          echo "Deezer:"
          echo "${{ inputs.deezer_url }}"

          echo ""
          echo "Pista solicitada:"
          echo "${{ inputs.track_title }}"

          echo ""

      - name: Extraer información de Deezer
        run: |

          echo "========================================"
          echo "EXTRAYENDO DATOS DE DEEZER"
          echo "========================================"

          python deezer_extractor.py \
            "${{ inputs.deezer_url }}" \
            > deezer_result.json

          echo ""
          echo "--- RESULTADO DEEZER ---"
          cat deezer_result.json
          echo ""

      - name: Preparar datos de la pista
        env:
          TRACK_TITLE: ${{ inputs.track_title }}

        run: |

          python - <<'PY'

          import json
          import os
          import sys

          with open(
              "deezer_result.json",
              "r",
              encoding="utf-8"
          ) as f:
              result = json.load(f)

          if not result.get("ok"):
              print(
                  "ERROR: El extractor de Deezer no devolvió ok=true."
              )
              sys.exit(1)

          data = (
              result.get("data")
              or {}
          )

          track_title_requested = (
              os.environ.get(
                  "TRACK_TITLE",
                  ""
              )
              .strip()
          )

          tracks = (
              data.get("tracks")
              or []
          )

          if not tracks:

              track = data

          else:

              track = None

              if track_title_requested:

                  requested_normalized = (
                      track_title_requested
                      .casefold()
                      .strip()
                  )

                  for candidate in tracks:

                      candidate_title = (
                          candidate.get(
                              "titulo_publicacion"
                          )
                          or candidate.get(
                              "titulo"
                          )
                          or ""
                      )

                      candidate_normalized = (
                          str(
                              candidate_title
                          )
                          .casefold()
                          .strip()
                      )

                      if (
                          candidate_normalized
                          == requested_normalized
                      ):

                          track = candidate
                          break

                  if track is None:

                      for candidate in tracks:

                          candidate_title = (
                              candidate.get(
                                  "titulo"
                              )
                              or ""
                          )

                          candidate_normalized = (
                              str(
                                  candidate_title
                              )
                              .casefold()
                              .strip()
                          )

                          if (
                              candidate_normalized
                              == requested_normalized
                          ):

                              track = candidate
                              break

              if (
                  track is None
                  and not track_title_requested
              ):

                  track = tracks[0]

              if track is None:

                  print("")
                  print(
                      "ERROR: No se encontró la pista solicitada:"
                  )
                  print(
                      track_title_requested
                  )
                  print("")

                  print(
                      "Pistas disponibles:"
                  )

                  for candidate in tracks:

                      title = (
                          candidate.get(
                              "titulo_publicacion"
                          )
                          or candidate.get(
                              "titulo"
                          )
                          or ""
                      )

                      print(
                          f" - {title}"
                      )

                  print("")

                  sys.exit(1)

          artistas_raw = (
              track.get(
                  "artistas"
              )
              or []
          )

          if isinstance(
              artistas_raw,
              str
          ):

              artistas = [
                  artista.strip()
                  for artista in
                  artistas_raw.split(",")
                  if artista.strip()
              ]

          elif isinstance(
              artistas_raw,
              list
          ):

              artistas = [
                  str(
                      artista
                  ).strip()
                  for artista in artistas_raw
                  if str(
                      artista
                  ).strip()
              ]

          else:

              artistas = []

          titulo_publicacion = (
              track.get(
                  "titulo_publicacion"
              )
              or track.get(
                  "titulo"
              )
              or ""
          )

          titulo = (
              track.get(
                  "titulo"
              )
              or ""
          )

          isrc = (
              track.get(
                  "isrc"
              )
              or ""
          )

          duracion_segundos = (
              track.get(
                  "duracion_segundos"
              )
          )

          if not titulo_publicacion:

              print(
                  "ERROR: Falta titulo_publicacion."
              )

              sys.exit(1)

          if not artistas:

              print(
                  "ERROR: No se pudieron determinar los artistas."
              )

              sys.exit(1)

          music_input = {

              "titulo": titulo,

              "titulo_publicacion":
                  titulo_publicacion,

              "artistas":
                  artistas,

              "isrc":
                  isrc,

              "duracion_segundos":
                  duracion_segundos
          }

          with open(
              "music_input.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  music_input,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "========================================"
          )
          print(
              "ENTRADA COMÚN PARA YOUTUBE MUSIC Y APPLE MUSIC"
          )
          print(
              "========================================"
          )
          print("")

          print(
              json.dumps(
                  music_input,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("")

          PY

      - name: Buscar en YouTube Music
        run: |

          echo "========================================"
          echo "BUSCANDO EN YOUTUBE MUSIC"
          echo "========================================"

          python - <<'PY'

          import json
          import subprocess
          import sys

          with open(
              "music_input.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          titulo_publicacion = (
              data.get(
                  "titulo_publicacion"
              )
              or ""
          )

          artistas = (
              data.get(
                  "artistas"
              )
              or []
          )

          isrc = (
              data.get(
                  "isrc"
              )
              or ""
          )

          duration_seconds = (
              data.get(
                  "duracion_segundos"
              )
          )

          artists_string = ", ".join(
              artistas
          )

          command = [

              sys.executable,

              "youtube_music_search.py",

              titulo_publicacion,

              artists_string,

              isrc
          ]

          if duration_seconds is not None:

              command.append(
                  str(
                      duration_seconds
                  )
              )

          print("")
          print(
              "Comando:"
          )

          print(
              " ".join(
                  f'"{x}"'
                  for x in command
              )
          )

          print("")

          process = subprocess.run(

              command,

              capture_output=True,

              text=True,

              check=True
          )

          with open(
              "youtube_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  process.stdout
              )

          print(
              "========================================"
          )

          print(
              "RESULTADO YOUTUBE MUSIC"
          )

          print(
              "========================================"
          )

          print("")

          print(
              process.stdout
          )

          print("")

          PY

      - name: Buscar en Apple Music
        run: |

          echo "========================================"
          echo "BUSCANDO EN APPLE MUSIC"
          echo "========================================"

          python - <<'PY'

          import json
          import subprocess
          import sys

          with open(
              "music_input.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          titulo_publicacion = (
              data.get(
                  "titulo_publicacion"
              )
              or ""
          )

          artistas = (
              data.get(
                  "artistas"
              )
              or []
          )

          isrc = (
              data.get(
                  "isrc"
              )
              or ""
          )

          duration_seconds = (
              data.get(
                  "duracion_segundos"
              )
          )

          artists_string = ", ".join(
              artistas
          )

          command = [

              sys.executable,

              "apple_music_search.py",

              titulo_publicacion,

              artists_string,

              isrc
          ]

          if duration_seconds is not None:

              command.append(
                  str(
                      duration_seconds
                  )
              )

          command.append(
              "us"
          )

          print("")
          print(
              "Comando:"
          )

          print(
              " ".join(
                  f'"{x}"'
                  for x in command
              )
          )

          print("")

          process = subprocess.run(

              command,

              capture_output=True,

              text=True,

              check=True
          )

          with open(
              "apple_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  process.stdout
              )

          print(
              "========================================"
          )

          print(
              "RESULTADO APPLE MUSIC"
          )

          print(
              "========================================"
          )

          print("")

          print(
              process.stdout
          )

          print("")

          PY

      - name: Construir resultado final
        run: |

          python - <<'PY'

          import json
          import sys

          with open(
              "deezer_result.json",
              "r",
              encoding="utf-8"
          ) as f:

              deezer_result = json.load(f)

          if not deezer_result.get("ok"):

              print(
                  "ERROR: Resultado Deezer inválido."
              )

              sys.exit(1)

          deezer = (
              deezer_result.get(
                  "data"
              )
              or {}
          )

          with open(
              "youtube_result.json",
              "r",
              encoding="utf-8"
          ) as f:

              youtube_result = json.load(f)

          youtube = (
              youtube_result.get(
                  "data"
              )
              or {}
          )

          with open(
              "apple_result.json",
              "r",
              encoding="utf-8"
          ) as f:

              apple_result = json.load(f)

          apple = (
              apple_result.get(
                  "data"
              )
              or {}
          )

          apple_isrc = (
              apple.get(
                  "isrc_apple"
              )
              or ""
          )

          deezer_isrc = (
              deezer.get(
                  "isrc"
              )
              or ""
          )

          if apple_isrc:

              if (
                  deezer_isrc
                  and
                  apple_isrc.upper()
                  == deezer_isrc.upper()
              ):

                  apple_isrc_status = (
                      "coincide"
                  )

              else:

                  apple_isrc_status = (
                      "no_coincide"
                  )

          else:

              apple_isrc_status = (
                  "no_disponible"
              )

          apple_preview = (
              apple.get(
                  "preview_apple"
              )
              or ""
          )

          deezer_preview = (
              deezer.get(
                  "preview_deezer"
              )
              or ""
          )

          if apple_preview:

              preview_url = apple_preview

              preview_source = (
                  "Apple Music"
              )

          elif deezer_preview:

              preview_url = deezer_preview

              preview_source = (
                  "Deezer"
              )

          else:

              preview_url = ""

              preview_source = ""

          youtube_url = (
              youtube.get(
                  "youtube_music_url"
              )
              or ""
          )

          deezer_url = (
              deezer.get(
                  "deezer_url"
              )
              or ""
          )

          if youtube_url:

              escuchar_url = youtube_url

              escuchar_fuente = (
                  "YouTube Music"
              )

          else:

              escuchar_url = deezer_url

              escuchar_fuente = (
                  "Deezer"
              )

          duracion_segundos = (
              deezer.get(
                  "duracion_segundos"
              )
          )

          final = {

              "artistas":
                  deezer.get(
                      "artistas"
                  )
                  or "",

              "titulo":
                  deezer.get(
                      "titulo"
                  )
                  or "",

              "titulo_publicacion":
                  deezer.get(
                      "titulo_publicacion"
                  )
                  or "",

              "nombre_publicacion":
                  deezer.get(
                      "nombre_publicacion"
                  )
                  or "",

              "duracion":
                  deezer.get(
                      "duracion"
                  )
                  or "",

              "duracion_segundos":
                  duracion_segundos,

              "fecha":
                  deezer.get(
                      "fecha"
                  )
                  or "",

              "portada":
                  deezer.get(
                      "portada"
                  )
                  or "",

              "deezer_url":
                  deezer_url,

              "isrc":
                  deezer_isrc,

              "preview":
                  {
                      "url":
                          preview_url,

                      "fuente":
                          preview_source
                  },

              "escuchar":
                  {
                      "url":
                          escuchar_url,

                      "fuente":
                          escuchar_fuente
                  },

              "youtube_music":
                  {

                      "encontrado":
                          youtube.get(
                              "encontrado"
                          )
                          is True,

                      "titulo":
                          youtube.get(
                              "titulo_ytmusic"
                          )
                          or "",

                      "artistas":
                          youtube.get(
                              "artistas_ytmusic"
                          )
                          or [],

                      "url":
                          youtube_url,

                      "video_id":
                          youtube.get(
                              "video_id"
                          )
                          or "",

                      "puntuacion":
                          youtube.get(
                              "mejor_puntuacion"
                          )
                          or 0.0,

                      "version_compatible":
                          youtube.get(
                              "version_compatible"
                          )
                          is True
                  },

              "apple_music":
                  {

                      "encontrado":
                          apple.get(
                              "encontrado"
                          )
                          is True,

                      "titulo":
                          apple.get(
                              "titulo_apple"
                          )
                          or "",

                      "artista":
                          apple.get(
                              "artista_apple"
                          )
                          or "",

                      "album":
                          apple.get(
                              "album_apple"
                          )
                          or "",

                      "url":
                          apple.get(
                              "apple_music_url"
                          )
                          or "",

                      "preview":
                          apple_preview,

                      "isrc":
                          apple_isrc,

                      "isrc_status":
                          apple_isrc_status,

                      "duracion_segundos":
                          apple.get(
                              "duracion_apple_segundos"
                          ),

                      "fecha":
                          apple.get(
                              "fecha_apple"
                          )
                          or "",

                      "puntuacion":
                          apple.get(
                              "mejor_puntuacion"
                          )
                          or 0.0,

                      "version_compatible":
                          apple.get(
                              "version_compatible"
                          )
                          is True
                  }
          }

          with open(
              "publication_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "========================================"
          )

          print(
              "RESULTADO FINAL DE LA PUBLICACIÓN"
          )

          print(
              "========================================"
          )

          print("")

          print(
              json.dumps(
                  final,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("")

          errors = []

          if not final[
              "titulo_publicacion"
          ]:

              errors.append(
                  "Falta titulo_publicacion."
              )

          if not final[
              "artistas"
          ]:

              errors.append(
                  "Faltan artistas."
              )

          if not final[
              "duracion"
          ]:

              errors.append(
                  "Falta duración."
              )

          if not final[
              "fecha"
          ]:

              errors.append(
                  "Falta fecha."
              )

          if not final[
              "portada"
          ]:

              errors.append(
                  "Falta portada."
              )

          if not final[
              "deezer_url"
          ]:

              errors.append(
                  "Falta URL de Deezer."
              )

          if not final[
              "youtube_music"
          ][
              "encontrado"
          ]:

              errors.append(
                  "No se encontró una coincidencia válida en YouTube Music."
              )

          if not final[
              "youtube_music"
          ][
              "url"
          ]:

              errors.append(
                  "YouTube Music no devolvió una URL."
              )

          if not final[
              "youtube_music"
          ][
              "version_compatible"
          ]:

              errors.append(
                  "La coincidencia de YouTube Music no es compatible con Deezer."
              )

          if not final[
              "apple_music"
          ][
              "encontrado"
          ]:

              errors.append(
                  "No se encontró una coincidencia válida en Apple Music."
              )

          if not final[
              "apple_music"
          ][
              "url"
          ]:

              errors.append(
                  "Apple Music no devolvió una URL."
              )

          if not final[
              "apple_music"
          ][
              "version_compatible"
          ]:

              errors.append(
                  "La coincidencia de Apple Music no es compatible con Deezer."
              )

          if not final[
              "preview"
          ][
              "url"
          ]:

              errors.append(
                  "No se encontró ningún preview disponible."
              )

          print(
              "========================================"
          )

          if errors:

              print(
                  "PRUEBA FALLIDA"
              )

              print(
                  "========================================"
              )

              for error in errors:

                  print(
                      f"ERROR: {error}"
                  )

              print("")

              sys.exit(1)

          print(
              "PRUEBA EXITOSA"
          )

          print(
              "========================================"
          )

          print("")

          print(
              f"Preview seleccionado: "
              f"{final['preview']['fuente']}"
          )

          print(
              f"Escuchar seleccionado: "
              f"{final['escuchar']['fuente']}"
          )

          print("")

          PY

      - name: Generar publicación de Telegram
        run: |

          echo "========================================"
          echo "GENERANDO PUBLICACIÓN DE TELEGRAM"
          echo "========================================"

          python telegram_formatter.py \
            publication_result.json \
            > telegram_result.json

          echo ""
          echo "--- RESULTADO TELEGRAM ---"
          cat telegram_result.json
          echo ""

          python - <<'PY'

          import json
          import sys

          with open(
              "telegram_result.json",
              "r",
              encoding="utf-8"
          ) as f:

              result = json.load(f)

          mensaje_1 = (
              result.get(
                  "mensaje_1"
              )
              or {}
          )

          mensaje_2 = (
              result.get(
                  "mensaje_2"
              )
              or {}
          )

          if mensaje_1.get("tipo") != "photo":

              print(
                  "ERROR: El mensaje 1 debe ser de tipo photo."
              )

              sys.exit(1)

          if not mensaje_1.get("photo"):

              print(
                  "ERROR: Falta la portada del mensaje 1."
              )

              sys.exit(1)

          if not mensaje_1.get("caption"):

              print(
                  "ERROR: Falta el caption del mensaje 1."
              )

              sys.exit(1)

          if mensaje_1.get("parse_mode") != "HTML":

              print(
                  "ERROR: El mensaje 1 debe utilizar HTML."
              )

              sys.exit(1)

          if mensaje_2.get("tipo") != "audio":

              print(
                  "ERROR: El mensaje 2 debe ser de tipo audio."
              )

              sys.exit(1)

          if not mensaje_2.get("preview"):

              print(
                  "ERROR: Falta el preview del mensaje 2."
              )

              sys.exit(1)

          boton = (
              mensaje_2.get(
                  "boton"
              )
              or {}
          )

          if not boton.get("text"):

              print(
                  "ERROR: Falta el texto del botón."
              )

              sys.exit(1)

          if not boton.get("url"):

              print(
                  "ERROR: Falta la URL del botón."
              )

              sys.exit(1)

          caption = (
              mensaje_1[
                  "caption"
              ]
          )

          print(
              "========================================"
          )

          print(
              "PUBLICACIÓN DE TELEGRAM"
          )

          print(
              "========================================"
          )

          print("")
          print(
              "MENSAJE 1 — PORTADA + CAPTION"
          )

          print("")
          print(caption)

          print("")
          print(
              "MENSAJE 2 — PREVIEW + BOTÓN"
          )

          print("")
          print(
              f"Preview: "
              f"{mensaje_2['preview']}"
          )

          print(
              f"Fuente: "
              f"{mensaje_2['preview_fuente']}"
          )

          print(
              f"Botón: "
              f"{boton['text']}"
          )

          print(
              f"URL: "
              f"{boton['url']}"
          )

          print("")
          print(
              "========================================"
          )

          print(
              "PRUEBA DEL FORMATO DE TELEGRAM EXITOSA"
          )

          print(
              "========================================"
          )

          PY

      - name: Publicar prueba en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "========================================"
          echo "PUBLICANDO PRUEBA EN TELEGRAM"
          echo "========================================"

          python telegram_publisher.py \
            telegram_result.json