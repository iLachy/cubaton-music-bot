name: Cubaton Music Bot

on:
  # El bot solo se inicia manualmente mientras se realizan pruebas.
  workflow_dispatch:

permissions:
  contents: write

# Evita ciclos simultáneos. Las ejecuciones manuales adicionales esperan su turno.
concurrency:
  group: cubaton-music-bot
  cancel-in-progress: false

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar código y estado granular
        run: |
          python -m py_compile bot.py telegram_message_state.py
          python -m unittest discover -s tests -v

      - name: Ciclo del bot (cada 5 minutos durante unas 5 h 35 min)
        shell: bash
        run: |
          set -euo pipefail

          INTERVALO=300
          DURACION_MAX=20100
          FALLOS_SEGUIDOS=0
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_state() {
            if [ -f state/releases.json ]; then
              git add state/releases.json
            fi
            if [ -f state/telegram_messages.json ]; then
              git add state/telegram_messages.json
            fi

            if git diff --cached --quiet; then
              echo "No hay cambios de estado que guardar."
              return 0
            fi

            git commit -m "Actualizar estado de publicaciones"

            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::error::No se pudo integrar el estado remoto. No se continuará."
              return 1
            fi

            if ! git push origin "HEAD:$BRANCH"; then
              echo "El primer push falló; se intentará sincronizar y repetir una vez."
              if ! git pull --rebase origin "$BRANCH"; then
                git rebase --abort || true
                echo "::error::Falló la sincronización tras el primer push."
                return 1
              fi
              if ! git push origin "HEAD:$BRANCH"; then
                echo "::error::No se pudo persistir el estado en GitHub."
                return 1
              fi
            fi
          }

          while [ "$SECONDS" -lt "$DURACION_MAX" ]; do
            INICIO=$SECONDS
            echo "::group::Ejecución $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

            # No ejecutar el bot sobre una copia desactualizada del estado.
            git pull --rebase --autostash origin "$BRANCH"

            if python bot.py; then
              FALLOS_SEGUIDOS=0
            else
              FALLOS_SEGUIDOS=$((FALLOS_SEGUIDOS + 1))
              echo "El bot terminó con error ($FALLOS_SEGUIDOS seguido/s)."
            fi

            # Un fallo de persistencia detiene el ciclo: no se permite
            # continuar con un estado local que no quedó guardado en GitHub.
            persist_state
            echo "::endgroup::"

            if [ "$FALLOS_SEGUIDOS" -ge 3 ]; then
              echo "::error::El bot falló 3 veces seguidas; se detiene el ciclo."
              exit 1
            fi

            ESPERA=$((INTERVALO - (SECONDS - INICIO)))
            if [ "$ESPERA" -lt 30 ]; then ESPERA=30; fi
            sleep "$ESPERA"
          done

      - name: Guardar estado pendiente
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f state/releases.json ] && [ ! -f state/telegram_messages.json ]; then
            echo "No hay archivos de estado para persistir."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"

          if [ -f state/releases.json ]; then
            git add state/releases.json
          fi
          if [ -f state/telegram_messages.json ]; then
            git add state/telegram_messages.json
          fi

          if git diff --cached --quiet; then
            echo "No hay cambios de estado pendientes."
            exit 0
          fi

          git commit -m "Guardar estado pendiente de publicaciones"

          if ! git pull --rebase origin "$BRANCH"; then
            git rebase --abort || true
            echo "::error::No se pudo integrar el estado pendiente."
            exit 1
          fi

          if ! git push origin "HEAD:$BRANCH"; then
            echo "El push final falló; se intentará sincronizar y repetir una vez."
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::error::Falló la sincronización del estado pendiente."
              exit 1
            fi
            git push origin "HEAD:$BRANCH"
          fi
