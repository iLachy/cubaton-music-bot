name: Test YouTube Music Search

on:
  workflow_dispatch:
    inputs:
      deezer_url:
        description: "Enlace de Deezer (track o album)"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Mostrar archivos
        run: |
          echo "========================================"
          echo "YOUTUBE MUSIC TEST"
          echo "========================================"

          echo ""
          echo "Archivo Deezer:"
          echo "----------------------------------------"

          sed -n '1,500p' deezer_extractor.py

          echo ""
          echo "Archivo YouTube Music:"
          echo "----------------------------------------"

          sed -n '1,500p' youtube_music_search.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          pip install requests ytmusicapi

      - name: Extraer datos de Deezer
        id: deezer
        run: |
          echo "========================================"
          echo "EXTRAYENDO DATOS DE DEEZER"
          echo "========================================"

          echo ""
          echo "URL:"
          echo "${{ inputs.deezer_url }}"

          echo ""

          python deezer_extractor.py \
            "${{ inputs.deezer_url }}" \
            > deezer_result.json

          cat deezer_result.json

      - name: Preparar datos para YouTube Music
        run: |
          python - <<'PY'
          import json
          import sys

          with open(
              "deezer_result.json",
              "r",
              encoding="utf-8"
          ) as f:
              result = json.load(f)

          if not result.get("ok"):
              print("ERROR: El extractor de Deezer falló.")
              print(result)
              sys.exit(1)

          data = result.get("data") or {}

          # --------------------------------------------------
          # SINGLE
          # --------------------------------------------------

          if data.get("deezer_track_id"):

              titulo_publicacion = data.get(
                  "titulo_publicacion"
              )

              artistas = data.get(
                  "artistas"
              )

              isrc = data.get(
                  "isrc"
              )

              duracion = data.get(
                  "duracion"
              )

              deezer_track_id = data.get(
                  "deezer_track_id"
              )

          # --------------------------------------------------
          # EP / ÁLBUM
          # --------------------------------------------------

          else:

              tracks = data.get(
                  "tracks"
              ) or []

              if not tracks:

                  print(
                      "ERROR: La publicación no contiene tracks."
                  )

                  sys.exit(1)

              # Para esta primera prueba usamos el primer
              # track del EP/álbum.
              track = tracks[0]

              titulo_publicacion = track.get(
                  "titulo_publicacion"
              )

              artistas = track.get(
                  "artistas"
              )

              isrc = track.get(
                  "isrc"
              )

              duracion = track.get(
                  "duracion"
              )

              deezer_track_id = track.get(
                  "deezer_track_id"
              )

          # --------------------------------------------------
          # Convertir artistas
          # --------------------------------------------------

          if isinstance(artistas, str):

              artists_list = [
                  artist.strip()
                  for artist in artistas.split(",")
                  if artist.strip()
              ]

          elif isinstance(artistas, list):

              artists_list = artistas

          else:

              artists_list = []

          # --------------------------------------------------
          # Convertir duración MM:SS -> segundos
          # --------------------------------------------------

          duration_seconds = None

          if duracion:

              try:

                  minutes, seconds = (
                      duracion.split(":")
                  )

                  duration_seconds = (
                      int(minutes) * 60
                      + int(seconds)
                  )

              except Exception:

                  duration_seconds = None

          # --------------------------------------------------
          # Crear archivo intermedio
          # --------------------------------------------------

          youtube_input = {
              "titulo_publicacion": (
                  titulo_publicacion
              ),
              "artistas": artists_list,
              "isrc": isrc,
              "duracion": duracion,
              "duracion_segundos": (
                  duration_seconds
              ),
              "deezer_track_id": (
                  deezer_track_id
              )
          }

          with open(
              "youtube_input.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  youtube_input,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "========================================"
          )
          print(
              "DATOS PREPARADOS PARA YOUTUBE MUSIC"
          )
          print(
              "========================================"
          )

          print(
              json.dumps(
                  youtube_input,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Buscar en YouTube Music
        run: |
          echo "========================================"
          echo "BUSCANDO EN YOUTUBE MUSIC"
          echo "========================================"

          python - <<'PY'
          import json
          import subprocess
          import sys

          with open(
              "youtube_input.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          titulo_publicacion = data.get(
              "titulo_publicacion"
          )

          artistas = data.get(
              "artistas"
          ) or []

          isrc = data.get(
              "isrc"
          )

          duration_seconds = data.get(
              "duracion_segundos"
          )

          artists_string = ", ".join(
              artistas
          )

          command = [
              sys.executable,
              "youtube_music_search.py",
              titulo_publicacion,
              artists_string,
          ]

          if isrc:
              command.append(isrc)
          else:
              command.append("")

          if duration_seconds is not None:
              command.append(
                  str(duration_seconds)
              )

          print(
              "Comando:"
          )

          print(
              " ".join(
                  f'"{x}"'
                  for x in command
              )
          )

          print("")

          subprocess.run(
              command,
              check=True
          )
          PY