name: Test - Telegram Publication

on:
  workflow_dispatch:
    inputs:
      processing_run_id:
        description: "Run ID del workflow de procesamiento multi-track"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT DEL REPOSITORIO
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONFIGURAR PYTHON
      # ============================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALAR FFMPEG / FFPROBE
      # ============================================================
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "=========================================="
          echo "FFmpeg"
          echo "=========================================="
          ffmpeg -version | head -n 1

          echo ""
          echo "=========================================="
          echo "FFprobe"
          echo "=========================================="
          ffprobe -version | head -n 1

      # ============================================================
      # 4. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 5. DESCARGAR ARTEFACTO DEL RUN DE PROCESAMIENTO
      # ============================================================
      - name: Descargar artefacto del procesamiento
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.processing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-processing-result
          path: processing_artifacts
          merge-multiple: true

      # ============================================================
      # 6. MOSTRAR CONTENIDO DEL ARTEFACTO
      # ============================================================
      - name: Inspeccionar artefactos descargados
        run: |
          echo "=========================================="
          echo "ARTEFACTOS DESCARGADOS"
          echo "=========================================="

          if [ ! -d "processing_artifacts" ]; then
            echo "ERROR: No existe processing_artifacts/"
            exit 1
          fi

          find processing_artifacts -maxdepth 2 -type f -print | sort

          echo ""
          echo "=========================================="
          echo "ARCHIVO PRINCIPAL"
          echo "=========================================="

          if [ ! -f "processing_artifacts/release_processing_result.json" ]; then
            echo "ERROR: No se encontró release_processing_result.json"
            exit 1
          fi

          cat processing_artifacts/release_processing_result.json

      # ============================================================
      # 7. COPIAR RESULTADO PRINCIPAL
      # ============================================================
      - name: Preparar resultado de procesamiento
        run: |
          cp \
            processing_artifacts/release_processing_result.json \
            processing_result.json

          echo "Resultado preparado:"
          ls -lh processing_result.json

      # ============================================================
      # 8. VALIDAR ESTRUCTURA GENERAL
      # ============================================================
      - name: Validar resultado del procesamiento
        run: |
          python - <<'PY'
          import json
          import sys

          path = "processing_result.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Tipo:", data.get("tipo"))
          print("Nombre publicación:", data.get("nombre_publicacion"))
          print("Fecha:", data.get("fecha"))
          print("Total pistas:", data.get("total_pistas"))
          print("Pistas procesadas:", data.get("pistas_procesadas"))
          print("Pistas fallidas:", data.get("pistas_fallidas"))

          if not data.get("ok"):
              print("")
              print("ERROR: El procesamiento no terminó correctamente.")
              print("Errores:")
              for error in data.get("errores", []):
                  print(" -", error)
              sys.exit(1)

          pistas = data.get("pistas")

          if not isinstance(pistas, list):
              print("ERROR: 'pistas' no es una lista.")
              sys.exit(1)

          if not pistas:
              print("ERROR: No hay pistas para publicar.")
              sys.exit(1)

          total = data.get("total_pistas")

          if total != len(pistas):
              print(
                  f"ERROR: total_pistas={total}, "
                  f"pero se recibieron {len(pistas)} pistas."
              )
              sys.exit(1)

          print("")
          print("✓ Estructura general válida")
          print(f"✓ {len(pistas)} pistas encontradas")
          PY

      # ============================================================
      # 9. PREPARAR Y VALIDAR TODOS LOS MENSAJES
      # ============================================================
      - name: Preparar mensajes de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          PROCESSING_FILE = Path("processing_result.json")
          OUTPUT_DIR = Path("telegram_prepared")

          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          with PROCESSING_FILE.open("r", encoding="utf-8") as f:
              data = json.load(f)

          pistas = data["pistas"]

          if not os.environ.get("TELEGRAM_BOT_TOKEN"):
              print("ERROR: Falta TELEGRAM_BOT_TOKEN.")
              sys.exit(1)

          if not os.environ.get("TELEGRAM_CHAT_ID"):
              print("ERROR: Falta TELEGRAM_CHAT_ID.")
              sys.exit(1)

          prepared_manifest = {
              "ok": False,
              "tipo": data.get("tipo"),
              "nombre_publicacion": data.get("nombre_publicacion"),
              "fecha": data.get("fecha"),
              "portada": data.get("portada"),
              "deezer_album_id": data.get("deezer_album_id"),
              "deezer_url": data.get("deezer_url"),
              "total_pistas": len(pistas),
              "pistas": []
          }

          print("==========================================")
          print("PREPARANDO PUBLICACIÓN")
          print("==========================================")
          print(f"Publicación: {data.get('nombre_publicacion')}")
          print(f"Fecha: {data.get('fecha')}")
          print(f"Pistas: {len(pistas)}")
          print("")

          # ----------------------------------------------------------
          # Procesamos TODOS los tracks antes de publicar cualquiera.
          # ----------------------------------------------------------
          for index, pista in enumerate(pistas, start=1):

              numero = f"{index:02d}"

              titulo = (
                  pista.get("titulo_publicacion")
                  or pista.get("titulo")
                  or f"Pista {index}"
              )

              print(f"[{numero}/{len(pistas):02d}] {titulo}")

              # ------------------------------------------------------
              # Crear archivo temporal de entrada para el formatter
              # ------------------------------------------------------
              track_input = OUTPUT_DIR / f"track_input_{numero}.json"

              with track_input.open("w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "tipo": data.get("tipo"),
                          "nombre_publicacion": data.get("nombre_publicacion"),
                          "fecha": data.get("fecha"),
                          "portada": data.get("portada"),
                          "deezer_album_id": data.get("deezer_album_id"),
                          "deezer_url": data.get("deezer_url"),
                          "track_index": index,
                          "total_tracks": len(pistas),
                          "track": pista
                      },
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              telegram_output = OUTPUT_DIR / f"telegram_result_{numero}.json"

              # ------------------------------------------------------
              # Ejecutar telegram_formatter.py
              # ------------------------------------------------------
              formatter = subprocess.run(
                  [
                      sys.executable,
                      "telegram_formatter.py",
                      str(track_input)
                  ],
                  capture_output=True,
                  text=True
              )

              if formatter.returncode != 0:
                  print("")
                  print("ERROR: telegram_formatter.py falló.")
                  print(formatter.stdout)
                  print(formatter.stderr)
                  sys.exit(1)

              stdout = formatter.stdout.strip()

              if not stdout:
                  print("ERROR: telegram_formatter.py no produjo salida.")
                  sys.exit(1)

              # ------------------------------------------------------
              # El formatter normalmente devuelve JSON por stdout.
              # ------------------------------------------------------
              try:
                  telegram_result = json.loads(stdout)
              except json.JSONDecodeError:
                  print("ERROR: La salida del formatter no es JSON válido.")
                  print("")
                  print("STDOUT:")
                  print(stdout)
                  print("")
                  print("STDERR:")
                  print(formatter.stderr)
                  sys.exit(1)

              with telegram_output.open("w", encoding="utf-8") as f:
                  json.dump(
                      telegram_result,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              # ======================================================
              # VALIDACIÓN MENSAJE 1
              # ======================================================
              mensaje_1 = telegram_result.get("mensaje_1")

              if not isinstance(mensaje_1, dict):
                  print("ERROR: Falta mensaje_1.")
                  sys.exit(1)

              if mensaje_1.get("tipo") != "photo":
                  print(
                      "ERROR: mensaje_1 debe ser de tipo 'photo'. "
                      f"Recibido: {mensaje_1.get('tipo')}"
                  )
                  sys.exit(1)

              if not mensaje_1.get("photo"):
                  print("ERROR: mensaje_1 no contiene 'photo'.")
                  sys.exit(1)

              if not mensaje_1.get("caption"):
                  print("ERROR: mensaje_1 no contiene 'caption'.")
                  sys.exit(1)

              # ======================================================
              # VALIDACIÓN MENSAJE 2
              # ======================================================
              mensaje_2 = telegram_result.get("mensaje_2")

              if not isinstance(mensaje_2, dict):
                  print("ERROR: Falta mensaje_2.")
                  sys.exit(1)

              if mensaje_2.get("tipo") != "audio":
                  print(
                      "ERROR: mensaje_2 debe ser de tipo 'audio'. "
                      f"Recibido: {mensaje_2.get('tipo')}"
                  )
                  sys.exit(1)

              if not mensaje_2.get("audio"):
                  print("ERROR: mensaje_2 no contiene 'audio'.")
                  sys.exit(1)

              # ======================================================
              # VALIDACIÓN DEL BOTÓN
              # ======================================================
              reply_markup = mensaje_2.get("reply_markup")

              if not isinstance(reply_markup, dict):
                  print("ERROR: mensaje_2 no contiene reply_markup.")
                  sys.exit(1)

              keyboard = reply_markup.get("inline_keyboard")

              if not isinstance(keyboard, list):
                  print("ERROR: inline_keyboard no es una lista.")
                  sys.exit(1)

              if len(keyboard) != 1:
                  print(
                      "ERROR: Debe existir exactamente una fila "
                      f"de botones. Filas encontradas: {len(keyboard)}"
                  )
                  sys.exit(1)

              row = keyboard[0]

              if not isinstance(row, list):
                  print("ERROR: La fila de botones no es una lista.")
                  sys.exit(1)

              if len(row) != 1:
                  print(
                      "ERROR: Debe existir exactamente un botón. "
                      f"Botones encontrados: {len(row)}"
                  )
                  sys.exit(1)

              button = row[0]

              if not isinstance(button, dict):
                  print("ERROR: El botón no es un objeto válido.")
                  sys.exit(1)

              button_text = button.get("text")
              button_url = button.get("url")

              if not button_text:
                  print("ERROR: El botón no tiene texto.")
                  sys.exit(1)

              if not button_url:
                  print("ERROR: El botón no tiene URL.")
                  sys.exit(1)

              # ======================================================
              # VALIDACIÓN FINAL DEL TRACK
              # ======================================================
              prepared_manifest["pistas"].append(
                  {
                      "index": index,
                      "deezer_track_id": pista.get("deezer_track_id"),
                      "titulo": pista.get("titulo"),
                      "titulo_publicacion": pista.get(
                          "titulo_publicacion"
                      ),
                      "telegram_file": str(
                          telegram_output
                      ),
                      "messages": 2,
                      "button_text": button_text,
                      "button_url": button_url
                  }
              )

              print("  Mensaje 1: ✓ photo + caption")
              print("  Mensaje 2: ✓ audio")
              print(
                  f"  Botón: ✓ {button_text} -> {button_url}"
              )
              print("  ✓ PISTA PREPARADA")
              print("")

          # ----------------------------------------------------------
          # SOLO aquí consideramos preparada toda la publicación.
          # ----------------------------------------------------------
          prepared_manifest["ok"] = True

          manifest_path = Path("telegram_prepared_manifest.json")

          with manifest_path.open("w", encoding="utf-8") as f:
              json.dump(
                  prepared_manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("==========================================")
          print("✓ TODAS LAS PISTAS PREPARADAS")
          print("==========================================")
          print(f"Pistas preparadas: {len(pistas)}/{len(pistas)}")
          print("")
          print(
              "IMPORTANTE: todavía NO se ha enviado ningún "
              "mensaje a Telegram."
          )
          PY

      # ============================================================
      # 10. MOSTRAR MANIFIESTO FINAL
      # ============================================================
      - name: Mostrar manifiesto de publicación
        run: |
          echo "=========================================="
          echo "MANIFIESTO DE PUBLICACIÓN"
          echo "=========================================="

          cat telegram_prepared_manifest.json

      # ============================================================
      # 11. PUBLICAR EN TELEGRAM
      # ============================================================
      - name: Publicar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          manifest_path = Path("telegram_prepared_manifest.json")

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          if not manifest.get("ok"):
              print("ERROR: El manifiesto no está marcado como válido.")
              sys.exit(1)

          pistas = manifest.get("pistas", [])

          if not pistas:
              print("ERROR: El manifiesto no contiene pistas.")
              sys.exit(1)

          print("==========================================")
          print("PUBLICACIÓN EN TELEGRAM")
          print("==========================================")
          print(
              f"Publicación: "
              f"{manifest.get('nombre_publicacion')}"
          )
          print(f"Pistas: {len(pistas)}")
          print("")

          # ========================================================
          # PUBLICACIÓN SECUENCIAL
          #
          # Cada pista produce EXACTAMENTE:
          #   1. mensaje photo
          #   2. mensaje audio
          #
          # No se procesa/publica la siguiente pista hasta terminar
          # la anterior.
          # ========================================================
          for position, pista in enumerate(pistas, start=1):

              index = pista.get("index")
              titulo = (
                  pista.get("titulo_publicacion")
                  or pista.get("titulo")
                  or f"Pista {index}"
              )

              telegram_file = pista.get("telegram_file")

              if not telegram_file:
                  print(
                      f"ERROR: La pista {index} no tiene "
                      "telegram_file."
                  )
                  sys.exit(1)

              telegram_path = Path(telegram_file)

              if not telegram_path.exists():
                  print(
                      f"ERROR: No existe el archivo "
                      f"{telegram_path}"
                  )
                  sys.exit(1)

              print(
                  f"[{position}/{len(pistas)}] Publicando: "
                  f"{titulo}"
              )

              # ----------------------------------------------------
              # Ejecutar publisher
              # ----------------------------------------------------
              publisher = subprocess.run(
                  [
                      sys.executable,
                      "telegram_publisher.py",
                      str(telegram_path)
                  ],
                  capture_output=True,
                  text=True
              )

              if publisher.stdout:
                  print(publisher.stdout)

              if publisher.returncode != 0:
                  print("")
                  print(
                      f"ERROR: Falló la publicación de la pista "
                      f"{index}."
                  )

                  if publisher.stderr:
                      print(publisher.stderr)

                  sys.exit(1)

              print(
                  f"✓ Pista {index} publicada correctamente."
              )

              # ----------------------------------------------------
              # Pausa entre pistas para evitar ráfagas innecesarias.
              # ----------------------------------------------------
              if position < len(pistas):
                  time.sleep(2)

          print("")
          print("==========================================")
          print("✓ PUBLICACIÓN COMPLETADA")
          print("==========================================")
          print(
              f"Pistas publicadas: "
              f"{len(pistas)}/{len(pistas)}"
          )
          print(
              f"Mensajes enviados: "
              f"{len(pistas) * 2}"
          )
          PY

      # ============================================================
      # 12. GUARDAR RESULTADOS DE LA PRUEBA
      # ============================================================
      - name: Subir resultados de publicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-publication-test-result
          path: |
            processing_result.json
            telegram_prepared_manifest.json
            telegram_prepared/
          if-no-files-found: warn