name: Test - Telegram Publication

on:
  workflow_dispatch:
    inputs:
      processing_run_id:
        description: "Run ID del workflow de procesamiento multi-track"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURAR PYTHON
      # ============================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALAR FFMPEG / FFPROBE
      # ============================================================
      - name: Instalar FFmpeg
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURANDO REPOSITORIOS APT"
          echo "=========================================="

          echo "Repositorios Ubuntu antes del ajuste:"
          grep -R "azure.archive.ubuntu.com" /etc/apt 2>/dev/null || true

          echo ""
          echo "Reemplazando azure.archive.ubuntu.com por archive.ubuntu.com..."

          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          echo ""
          echo "Repositorios Ubuntu después del ajuste:"
          grep -R "archive.ubuntu.com" /etc/apt 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "ACTUALIZANDO ÍNDICES APT"
          echo "=========================================="

          sudo apt-get update

          echo ""
          echo "=========================================="
          echo "INSTALANDO FFMPEG"
          echo "=========================================="

          sudo apt-get install -y ffmpeg

          echo ""
          echo "=========================================="
          echo "VERIFICANDO FFMPEG"
          echo "=========================================="

          command -v ffmpeg
          ffmpeg -version | head -n 1

          echo ""
          echo "=========================================="
          echo "VERIFICANDO FFPROBE"
          echo "=========================================="

          command -v ffprobe
          ffprobe -version | head -n 1

          echo ""
          echo "✓ FFmpeg instalado correctamente"
          echo "✓ FFprobe instalado correctamente"

      # ============================================================
      # 4. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 5. DESCARGAR ARTEFACTO DEL RUN DE PROCESAMIENTO
      # ============================================================
      - name: Descargar artefacto del procesamiento
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.processing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-processing-result
          path: processing_artifacts
          merge-multiple: true

      # ============================================================
      # 6. INSPECCIONAR ARTEFACTOS
      # ============================================================
      - name: Inspeccionar artefactos descargados
        run: |
          echo "=========================================="
          echo "ARTEFACTOS DESCARGADOS"
          echo "=========================================="

          if [ ! -d "processing_artifacts" ]; then
            echo "ERROR: No existe processing_artifacts/"
            exit 1
          fi

          find processing_artifacts -maxdepth 2 -type f -print | sort

          echo ""
          echo "=========================================="
          echo "ARCHIVO PRINCIPAL"
          echo "=========================================="

          if [ ! -f "processing_artifacts/release_processing_result.json" ]; then
            echo "ERROR: No se encontró release_processing_result.json"
            exit 1
          fi

          cat processing_artifacts/release_processing_result.json

      # ============================================================
      # 7. PREPARAR RESULTADO DE PROCESAMIENTO
      # ============================================================
      - name: Preparar resultado de procesamiento
        run: |
          cp \
            processing_artifacts/release_processing_result.json \
            processing_result.json

          echo "Resultado preparado:"
          ls -lh processing_result.json

      # ============================================================
      # 8. VALIDAR RESULTADO GENERAL
      # ============================================================
      - name: Validar resultado del procesamiento
        run: |
          python - <<'PY'
          import json
          import sys

          path = "processing_result.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("==========================================")
          print("VALIDACIÓN DEL RESULTADO")
          print("==========================================")
          print("")
          print("Tipo:", data.get("tipo"))
          print("Nombre publicación:", data.get("nombre_publicacion"))
          print("Fecha:", data.get("fecha"))
          print("Deezer album ID:", data.get("deezer_album_id"))
          print("Total pistas:", data.get("total_pistas"))
          print("Pistas procesadas:", data.get("pistas_procesadas"))
          print("Pistas fallidas:", data.get("pistas_fallidas"))

          if not data.get("ok"):
              print("")
              print("ERROR: El procesamiento no terminó correctamente.")
              print("Errores:")

              for error in data.get("errores", []):
                  print(" -", error)

              sys.exit(1)

          pistas = data.get("pistas")

          if not isinstance(pistas, list):
              print("ERROR: 'pistas' no es una lista.")
              sys.exit(1)

          if not pistas:
              print("ERROR: No hay pistas para publicar.")
              sys.exit(1)

          total = data.get("total_pistas")

          if total != len(pistas):
              print(
                  f"ERROR: total_pistas={total}, "
                  f"pero se recibieron {len(pistas)} pistas."
              )
              sys.exit(1)

          album_id = data.get("deezer_album_id")

          if album_id is None:
              print("ERROR: Falta deezer_album_id.")
              sys.exit(1)

          print("")
          print("✓ Resultado general válido")
          print(f"✓ {len(pistas)} pistas encontradas")
          print(f"✓ Deezer album ID: {album_id}")
          PY

      # ============================================================
      # 9. INICIALIZAR ESTADO DE PUBLICACIÓN
      # ============================================================
      - name: Inicializar estado de publicación
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from publication_state import (
              cargar_estado,
              crear_o_actualizar_pista,
              crear_o_actualizar_release,
              guardar_estado,
              resumen_release,
              validar_estado,
          )

          PROCESSING_FILE = Path("processing_result.json")
          STATE_FILE = Path("data/publication_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)

          with PROCESSING_FILE.open("r", encoding="utf-8") as f:
              data = json.load(f)

          album_id = data["deezer_album_id"]
          pistas = data["pistas"]

          print("==========================================")
          print("INICIALIZANDO ESTADO DE PUBLICACIÓN")
          print("==========================================")
          print("")
          print("Release:", data.get("nombre_publicacion"))
          print("Deezer album ID:", album_id)
          print("Total de pistas:", len(pistas))
          print("")

          estado = cargar_estado(STATE_FILE)

          release = crear_o_actualizar_release(
              estado,
              deezer_album_id=album_id,
              deezer_url=data.get("deezer_url"),
              tipo=data.get("tipo"),
              nombre_publicacion=data.get("nombre_publicacion"),
              fecha=data.get("fecha"),
              portada=data.get("portada"),
              total_pistas=len(pistas)
          )

          for index, pista in enumerate(pistas, start=1):
              track_id = pista.get("deezer_track_id")

              if track_id is None:
                  raise RuntimeError(
                      f"La pista {index} no tiene deezer_track_id."
                  )

              titulo = (
                  pista.get("titulo")
                  or pista.get("titulo_publicacion")
                  or f"Pista {index}"
              )

              titulo_publicacion = (
                  pista.get("titulo_publicacion")
                  or pista.get("titulo")
                  or f"Pista {index}"
              )

              artistas = pista.get("artistas")
              duracion = (
                  pista.get("duracion_segundos")
                  or pista.get("duration")
              )
              isrc = pista.get("isrc")

              crear_o_actualizar_pista(
                  release,
                  deezer_track_id=track_id,
                  index=index,
                  titulo=titulo,
                  titulo_publicacion=titulo_publicacion,
                  artistas=artistas,
                  duracion_segundos=duracion,
                  isrc=isrc
              )

              print(
                  f"  [{index:02d}/{len(pistas):02d}] "
                  f"{titulo_publicacion} "
                  f"(track ID {track_id})"
              )

          guardar_estado(estado, STATE_FILE)
          validar_estado(estado)
          resumen = resumen_release(release)

          print("")
          print("==========================================")
          print("ESTADO INICIALIZADO")
          print("==========================================")
          print(
              json.dumps(
                  resumen,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("")
          print("✓ Las pistas están registradas.")
          print("✓ Estado guardado en:")
          print(f"  {STATE_FILE}")
          PY

      # ============================================================
      # 10. MOSTRAR ESTADO ANTES DE PUBLICAR
      # ============================================================
      - name: Mostrar estado antes de publicar
        run: |
          echo "=========================================="
          echo "PUBLICATION STATE - ANTES"
          echo "=========================================="

          if [ ! -f "data/publication_state.json" ]; then
            echo "ERROR: No existe data/publication_state.json"
            exit 1
          fi

          cat data/publication_state.json

      # ============================================================
      # 11. PREPARAR Y VALIDAR TODOS LOS MENSAJES
      # ============================================================
      - name: Preparar mensajes de Telegram
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          PROCESSING_FILE = Path("processing_result.json")
          OUTPUT_DIR = Path("telegram_prepared")

          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          with PROCESSING_FILE.open("r", encoding="utf-8") as f:
              data = json.load(f)

          pistas = data["pistas"]

          prepared_manifest = {
              "ok": False,
              "tipo": data.get("tipo"),
              "nombre_publicacion": data.get("nombre_publicacion"),
              "fecha": data.get("fecha"),
              "portada": data.get("portada"),
              "deezer_album_id": data.get("deezer_album_id"),
              "deezer_url": data.get("deezer_url"),
              "total_pistas": len(pistas),
              "pistas": []
          }

          print("==========================================")
          print("PREPARANDO PUBLICACIÓN")
          print("==========================================")
          print(
              f"Publicación: {data.get('nombre_publicacion')}"
          )
          print(f"Fecha: {data.get('fecha')}")
          print(f"Pistas: {len(pistas)}")
          print("")

          for index, pista in enumerate(pistas, start=1):
              numero = f"{index:02d}"

              titulo = (
                  pista.get("titulo_publicacion")
                  or pista.get("titulo")
                  or f"Pista {index}"
              )

              print(
                  f"[{numero}/{len(pistas):02d}] {titulo}"
              )

              track_input = (
                  OUTPUT_DIR /
                  f"track_input_{numero}.json"
              )

              with track_input.open("w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "tipo": data.get("tipo"),
                          "nombre_publicacion": (
                              data.get("nombre_publicacion")
                          ),
                          "fecha": data.get("fecha"),
                          "portada": data.get("portada"),
                          "deezer_album_id": (
                              data.get("deezer_album_id")
                          ),
                          "deezer_url": data.get("deezer_url"),
                          "track_index": index,
                          "total_tracks": len(pistas),
                          "track": pista
                      },
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              telegram_output = (
                  OUTPUT_DIR /
                  f"telegram_result_{numero}.json"
              )

              formatter = subprocess.run(
                  [
                      sys.executable,
                      "telegram_formatter.py",
                      str(track_input)
                  ],
                  capture_output=True,
                  text=True
              )

              if formatter.returncode != 0:
                  print("")
                  print("ERROR: telegram_formatter.py falló.")
                  print(formatter.stdout)
                  print(formatter.stderr)
                  sys.exit(1)

              stdout = formatter.stdout.strip()

              if not stdout:
                  print("ERROR: telegram_formatter.py no produjo salida.")
                  sys.exit(1)

              try:
                  telegram_result = json.loads(stdout)
              except json.JSONDecodeError:
                  print("ERROR: La salida del formatter no es JSON válido.")
                  print("")
                  print("STDOUT:")
                  print(stdout)
                  print("")
                  print("STDERR:")
                  print(formatter.stderr)
                  sys.exit(1)

              with telegram_output.open("w", encoding="utf-8") as f:
                  json.dump(
                      telegram_result,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              mensaje_1 = telegram_result.get("mensaje_1")

              if not isinstance(mensaje_1, dict):
                  print("ERROR: Falta mensaje_1.")
                  sys.exit(1)

              if mensaje_1.get("tipo") != "photo":
                  print(
                      "ERROR: mensaje_1 debe ser 'photo'. "
                      f"Recibido: {mensaje_1.get('tipo')}"
                  )
                  sys.exit(1)

              if not mensaje_1.get("photo"):
                  print("ERROR: mensaje_1 no contiene 'photo'.")
                  sys.exit(1)

              if not mensaje_1.get("caption"):
                  print("ERROR: mensaje_1 no contiene 'caption'.")
                  sys.exit(1)

              mensaje_2 = telegram_result.get("mensaje_2")

              if not isinstance(mensaje_2, dict):
                  print("ERROR: Falta mensaje_2.")
                  sys.exit(1)

              if mensaje_2.get("tipo") != "audio":
                  print(
                      "ERROR: mensaje_2 debe ser 'audio'. "
                      f"Recibido: {mensaje_2.get('tipo')}"
                  )
                  sys.exit(1)

              if not mensaje_2.get("audio"):
                  print("ERROR: mensaje_2 no contiene 'audio'.")
                  sys.exit(1)

              reply_markup = mensaje_2.get("reply_markup")

              if not isinstance(reply_markup, dict):
                  print("ERROR: mensaje_2 no contiene reply_markup.")
                  sys.exit(1)

              keyboard = reply_markup.get("inline_keyboard")

              if not isinstance(keyboard, list):
                  print("ERROR: inline_keyboard no es una lista.")
                  sys.exit(1)

              if len(keyboard) != 1:
                  print(
                      "ERROR: Debe existir exactamente una fila de botones. "
                      f"Filas encontradas: {len(keyboard)}"
                  )
                  sys.exit(1)

              row = keyboard[0]

              if not isinstance(row, list):
                  print("ERROR: La fila de botones no es una lista.")
                  sys.exit(1)

              if len(row) != 1:
                  print(
                      "ERROR: Debe existir exactamente un botón. "
                      f"Botones encontrados: {len(row)}"
                  )
                  sys.exit(1)

              button = row[0]

              if not isinstance(button, dict):
                  print("ERROR: El botón no es un objeto válido.")
                  sys.exit(1)

              button_text = button.get("text")
              button_url = button.get("url")

              if not button_text:
                  print("ERROR: El botón no tiene texto.")
                  sys.exit(1)

              if not button_url:
                  print("ERROR: El botón no tiene URL.")
                  sys.exit(1)

              prepared_manifest["pistas"].append(
                  {
                      "index": index,
                      "deezer_track_id": pista.get("deezer_track_id"),
                      "titulo": pista.get("titulo"),
                      "titulo_publicacion": pista.get("titulo_publicacion"),
                      "telegram_file": str(telegram_output),
                      "messages": 2,
                      "button_text": button_text,
                      "button_url": button_url
                  }
              )

              print("  Mensaje 1: ✓ photo + caption")
              print("  Mensaje 2: ✓ audio")
              print(f"  Botón: ✓ {button_text} -> {button_url}")
              print("  ✓ PISTA PREPARADA\n")

          prepared_manifest["ok"] = True

          manifest_path = Path("telegram_prepared_manifest.json")

          with manifest_path.open("w", encoding="utf-8") as f:
              json.dump(
                  prepared_manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("==========================================")
          print("✓ TODAS LAS PISTAS PREPARADAS")
          print("==========================================")
          print(f"Pistas preparadas: {len(pistas)}/{len(pistas)}\n")
          print("IMPORTANTE: todavía NO se ha enviado ningún mensaje a Telegram.")
          PY

      # ============================================================
      # 12. MOSTRAR MANIFIESTO
      # ============================================================
      - name: Mostrar manifiesto de publicación
        run: |
          echo "=========================================="
          echo "MANIFIESTO DE PUBLICACIÓN"
          echo "=========================================="

          cat telegram_prepared_manifest.json

      # ============================================================
      # 13. PUBLICAR EN TELEGRAM
      # ============================================================
      - name: Publicar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          manifest_path = Path("telegram_prepared_manifest.json")

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          if not manifest.get("ok"):
              print("ERROR: El manifiesto no está marcado como válido.")
              sys.exit(1)

          pistas = manifest.get("pistas", [])

          if not pistas:
              print("ERROR: El manifiesto no contiene pistas.")
              sys.exit(1)

          album_id = manifest.get("deezer_album_id")

          if album_id is None:
              print("ERROR: El manifiesto no contiene deezer_album_id.")
              sys.exit(1)

          print("==========================================")
          print("PUBLICACIÓN EN TELEGRAM")
          print("==========================================")
          print(f"Publicación: {manifest.get('nombre_publicacion')}")
          print(f"Deezer album ID: {album_id}")
          print(f"Pistas: {len(pistas)}\n")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          for position, pista in enumerate(pistas, start=1):
              index = pista.get("index")

              titulo = (
                  pista.get("titulo_publicacion")
                  or pista.get("titulo")
                  or f"Pista {index}"
              )

              telegram_file = pista.get("telegram_file")
              track_id = pista.get("deezer_track_id")

              if not telegram_file:
                  print(f"ERROR: La pista {index} no tiene telegram_file.")
                  sys.exit(1)

              if track_id is None:
                  print(f"ERROR: La pista {index} no tiene deezer_track_id.")
                  sys.exit(1)

              telegram_path = Path(telegram_file)

              if not telegram_path.exists():
                  print(f"ERROR: No existe el archivo {telegram_path}")
                  sys.exit(1)

              print(f"[{position}/{len(pistas)}] Publicando: {titulo}")
              print(f"  Track ID: {track_id}")

              publisher = subprocess.run(
                  [
                      sys.executable,
                      "telegram_publisher.py",
                      str(telegram_path),
                      "--state-file",
                      "data/publication_state.json",
                      "--deezer-album-id",
                      str(album_id),
                      "--deezer-track-id",
                      str(track_id),
                      "--track-index",
                      str(index),
                      "--tipo",
                      str(manifest.get("tipo") or ""),
                      "--nombre-publicacion",
                      str(manifest.get("nombre_publicacion") or ""),
                      "--fecha",
                      str(manifest.get("fecha") or ""),
                      "--portada",
                      str(manifest.get("portada") or "")
                  ],
                  capture_output=True,
                  text=True
              )

              if publisher.stdout:
                  print(publisher.stdout)

              if publisher.returncode != 0:
                  print(f"\nERROR: Falló la publicación de la pista {index}.")

                  if publisher.stderr:
                      print("STDERR:")
                      print(publisher.stderr)

                  sys.exit(1)

              print(f"✓ Pista {index} procesada correctamente.")

              print("\n==========================================")
              print("PERSISTIENDO ESTADO EN GITHUB")
              print("==========================================")

              git_add = subprocess.run(
                  ["git", "add", "data/publication_state.json"],
                  capture_output=True,
                  text=True
              )

              if git_add.returncode != 0:
                  print(git_add.stderr)
                  sys.exit(1)

              changes = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"],
                  capture_output=True,
                  text=True
              )

              if changes.returncode == 0:
                  print("✓ No hay cambios nuevos en publication_state.json.")

              elif changes.returncode == 1:
                  commit = subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          f"Persist publication state: track {index}"
                      ],
                      capture_output=True,
                      text=True
                  )

                  if commit.returncode != 0:
                      print("ERROR: No se pudo crear el commit.")
                      print(commit.stdout)
                      print(commit.stderr)
                      sys.exit(1)

                  branch = os.environ.get("GITHUB_REF_NAME", "main")

                  push = subprocess.run(
                      ["git", "push", "origin", f"HEAD:{branch}"],
                      capture_output=True,
                      text=True
                  )

                  if push.returncode != 0:
                      print("ERROR: No se pudo hacer push del estado.")
                      print(push.stdout)
                      print(push.stderr)
                      sys.exit(1)

                  print("✓ Estado persistido en el repositorio.")

              else:
                  print("ERROR: git diff --cached falló.")
                  print(changes.stderr)
                  sys.exit(1)

              print("")

              if position < len(pistas):
                  time.sleep(2)

          print("==========================================")
          print("✓ PUBLICACIÓN COMPLETADA")
          print("==========================================")
          print(f"Pistas procesadas: {len(pistas)}/{len(pistas)}")
          print(f"Mensajes enviados/verificados: {len(pistas) * 2}")
          PY

      # ============================================================
      # 14. PERSISTIR ESTADO SI EL WORKFLOW FALLÓ
      # ============================================================
      - name: Persistir estado tras cualquier resultado
        if: always()
        run: |
          echo "=========================================="
          echo "PERSISTENCIA FINAL DEL ESTADO"
          echo "=========================================="

          if [ ! -f "data/publication_state.json" ]; then
            echo "No existe data/publication_state.json."
            echo "No hay estado que persistir."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publication_state.json

          if git diff --cached --quiet; then
            echo "✓ No hay cambios pendientes."
            exit 0
          fi

          git commit -m "Persist publication state after workflow"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "✓ Estado final persistido en el repositorio."

      # ============================================================
      # 15. MOSTRAR ESTADO FINAL
      # ============================================================
      - name: Mostrar estado final
        if: always()
        run: |
          echo "=========================================="
          echo "PUBLICATION STATE - FINAL"
          echo "=========================================="

          if [ -f "data/publication_state.json" ]; then
            cat data/publication_state.json
          else
            echo "No existe data/publication_state.json"
          fi

      # ============================================================
      # 16. SUBIR RESULTADOS
      # ============================================================
      - name: Subir resultados de publicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-publication-test-result
          path: |
            processing_result.json
            telegram_prepared_manifest.json
            telegram_prepared/
            data/publication_state.json
          if-no-files-found: warn
